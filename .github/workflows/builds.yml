name: Native builds

on:
  workflow_dispatch:
    inputs:
      target:
        description: What to build
        type: choice
        options:
          - all
          - macos
          - android
        default: all

jobs:
  macos:
    name: macOS desktop
    if: ${{ inputs.target == 'all' || inputs.target == 'macos' }}
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json

      - name: Install web dependencies
        run: npm ci

      - name: Install Electron dependencies
        run: npm ci --prefix desktop

      - name: Build universal DMG and ZIP
        run: npm run desktop:build:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - uses: actions/upload-artifact@v4
        with:
          name: my-library-macos
          path: |
            desktop/release/*.dmg
            desktop/release/*.zip
          if-no-files-found: error

  android:
    name: Android APK
    if: ${{ inputs.target == 'all' || inputs.target == 'android' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mobile/package-lock.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $SDK_ROOT" >&2
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Install web dependencies
        run: npm ci

      - name: Install Capacitor dependencies
        run: npm ci --prefix mobile

      - name: Build debug APK
        run: npm run mobile:build:apk

      - uses: actions/upload-artifact@v4
        with:
          name: my-library-android
          path: mobile/release/*.apk
          if-no-files-found: error
