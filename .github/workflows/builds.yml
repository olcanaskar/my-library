name: Native builds

on:
  workflow_dispatch:

jobs:
  macos:
    name: macOS desktop
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json

      - name: Install web dependencies
        run: npm ci

      - name: Install Electron dependencies
        run: npm ci --prefix desktop

      - name: Build universal DMG and ZIP
        run: npm run desktop:build:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - uses: actions/upload-artifact@v4
        with:
          name: my-library-macos
          path: |
            desktop/release/*.dmg
            desktop/release/*.zip
          if-no-files-found: error

  android:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install web dependencies
        run: npm ci

      - name: Install Capacitor dependencies
        run: npm ci --prefix mobile

      - name: Build debug APK
        run: npm run mobile:build:apk

      - uses: actions/upload-artifact@v4
        with:
          name: my-library-android
          path: mobile/release/*.apk
          if-no-files-found: error
